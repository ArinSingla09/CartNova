services:
  cosmos:
    image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-latest
    container_name: cartnova-cosmos
    command: ["--protocol", "http"]
    ports:
      - "8081:8081"
      - "1234:1234"
      - "8080:8080"

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: cartnova-azurite
    command:
      - azurite
      - --blobHost
      - 0.0.0.0
      - --blobPort
      - "10000"
      - --queueHost
      - 0.0.0.0
      - --queuePort
      - "10001"
      - --location
      - /data
      - --loose
      - --skipApiVersionCheck
    ports:
      - "10000:10000"
      - "10001:10001"
    volumes:
      - azurite_data:/data

volumes:
  azurite_data: